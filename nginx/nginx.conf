# nginx.conf — Wora Agent OS Production Reverse Proxy & Load Balancer
# Handles: TLS 1.2/1.3, WebSocket sticky sessions, API rate limiting, SPA assets

worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  # ── Logging ──
  log_format main '$remote_addr - $request_time "$request" $status $body_bytes_sent';
  access_log /var/log/nginx/access.log main buffer=32k flush=5s;
  error_log  /var/log/nginx/error.log warn;

  # ── Performance ──
  sendfile          on;
  tcp_nopush        on;
  tcp_nodelay       on;
  keepalive_timeout 75s;

  gzip            on;
  gzip_vary       on;
  gzip_min_length 1024;
  gzip_types      text/plain text/css application/json application/javascript image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ── Rate & Connection Limiting ──
  limit_req_zone  $binary_remote_addr zone=api:10m   rate=60r/m;
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  # ── Upstreams ──
  upstream wora_api {
    ip_hash;
    server api:4000 max_fails=3 fail_timeout=30s;
    keepalive 64;
  }

  upstream wora_client {
    server client:80 max_fails=3 fail_timeout=15s;
    keepalive 16;
  }

  # ── HTTP → HTTPS redirect ──
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # ── Main HTTPS server ──
  server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security Headers ──
    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── WebSocket (Socket.IO) ──
    location /socket.io/ {
      limit_conn perip 50;
      proxy_pass              http://wora_api;
      proxy_http_version      1.1;
      proxy_set_header        Upgrade           $http_upgrade;
      proxy_set_header        Connection        $connection_upgrade;
      proxy_set_header        Host              $host;
      proxy_set_header        X-Real-IP         $remote_addr;
      proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header        X-Forwarded-Proto $scheme;
      proxy_read_timeout      3600s;
      proxy_send_timeout      3600s;
      proxy_connect_timeout   10s;
      proxy_buffering         off;
    }

    # ── REST API ──
    location /api/ {
      limit_req          zone=api burst=20 nodelay;
      proxy_pass         http://wora_api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # ── Health Probe ──
    location = /health {
      proxy_pass http://wora_api;
      access_log off;
    }

    # ── Static Immutable Assets (preserve security headers explicitly) ──
    location ~* \.(js|css|woff2|glb|png|svg|ico)$ {
      proxy_pass         http://wora_client;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      expires            30d;
      add_header Cache-Control             "public, immutable" always;
      add_header X-Frame-Options           "DENY" always;
      add_header X-Content-Type-Options    "nosniff" always;
      add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ── Frontend SPA ──
    location / {
      proxy_pass         http://wora_client;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
