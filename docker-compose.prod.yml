# ══════════════════════════════════════════════════════════════════
#  Wora Agent OS v4.1 — Production Docker Compose (2026)
#  Usage:
#    1. cp .env.example .env   (populate secrets & domain)
#    2. docker compose -f docker-compose.prod.yml up -d --build
#    3. docker compose -f docker-compose.prod.yml exec api node dist/seed.mjs
# ══════════════════════════════════════════════════════════════════

services:
  # ── Redis (BullMQ + Socket.IO Adapter + Presence + Workspaces) ──
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      - --maxmemory
      - 768mb
      - --maxmemory-policy
      - noeviction
      - --save
      - "60"
      - "1000"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-data:/data
    networks:
      - wora-net
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 896M

  # ── API Server + Socket.IO + BullMQ Worker ──────────────────────────
  # SQLite is single-writer. Keep exactly one API replica while os-data is a
  # SQLite volume. Scale out only after moving the OS store to PostgreSQL.
  api:
    image: ${WORA_API_IMAGE:-wora-api:release}
    build:
      context: .
      dockerfile: api-server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONGO_URI: ${MONGO_URI:?MONGO_URI must be set in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set in .env}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      STUDIO_PROVIDER: ${STUDIO_PROVIDER:-}
      STUDIO_MODEL: ${STUDIO_MODEL:-}
      GITHUB_SKILLS_TOKEN: ${GITHUB_SKILLS_TOKEN:-}
      MAX_SOCKETS: ${MAX_SOCKETS:-6000}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-30}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-90000}
      WORA_OS_DB: /app/data/wora-os.db
      WORA_WORKSPACE: /app/data/workspace
      WORA_RUNTIME_ROOT: /app/data/runtime
      WORA_CLOUD_PROVIDER: docker
      WORA_BROWSER_PROVIDER: docker
      WORA_CLOUD_IMAGE: ${WORA_CLOUD_IMAGE:-node:22-alpine}
      WORA_BROWSER_IMAGE: ${WORA_BROWSER_IMAGE:-wora-browser-runtime:1.0.0}
      WORA_BROWSER_SANDBOX: ${WORA_BROWSER_SANDBOX:-chromium}
      WORA_SECRET_KEY_FILE: /app/data/.wora-secret-key
      DOCKER_HOST: tcp://runtime-docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/api
    volumes:
      - os-data:/app/data
      - runtime-data:/app/data/runtime
      - runtime-certs:/certs:ro
    depends_on:
      redis:
        condition: service_healthy
      keyring-init:
        condition: service_completed_successfully
      runtime-docker:
        condition: service_healthy
      runtime-certs-init:
        condition: service_completed_successfully
      runtime-bootstrap:
        condition: service_completed_successfully
    networks:
      - wora-net
      - wora-runtime-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  # ── Dedicated isolated runtime daemon (DinD) ───────────────────────
  # The API never receives the host Docker socket. It talks to this dedicated
  # daemon over TLS. Cloud computers and browser containers live here.
  runtime-docker:
    image: docker:27-dind
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - runtime-docker-data:/var/lib/docker
      - runtime-certs:/certs
      - runtime-data:/app/data/runtime
    networks:
      - wora-net
      - wora-runtime-net
    healthcheck:
      test: ["CMD-SHELL", "docker info >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # One-shot: make the DinD client certificates readable by the non-root API
  # user without making them world-readable.
  runtime-certs-init:
    image: alpine:3.20
    restart: "no"
    volumes:
      - runtime-certs:/certs
    depends_on:
      runtime-docker:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        mkdir -p /certs/api
        cp -R /certs/client/. /certs/api/
        chown -R 1000:1000 /certs/api
        chmod 600 /certs/api/*.pem

  # One-shot: build the pinned browser image inside the dedicated runtime daemon.
  runtime-bootstrap:
    image: ${WORA_API_IMAGE:-wora-api:release}
    restart: "no"
    environment:
      DOCKER_HOST: tcp://runtime-docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/api
    volumes:
      - runtime-certs:/certs:ro
    networks:
      - wora-runtime-net
    depends_on:
      runtime-docker:
        condition: service_healthy
      runtime-certs-init:
        condition: service_completed_successfully
    command:
      - sh
      - -ec
      - |
        mkdir -p /tmp/browser-context/dist /tmp/browser-context/node_modules
        cp /app/dist/browser-runner.mjs /tmp/browser-context/dist/
        cp -R /app/node_modules/playwright-core /tmp/browser-context/node_modules/
        cp /app/browser-runtime.Dockerfile /tmp/browser-context/
        docker pull "${WORA_CLOUD_IMAGE:-node:22-alpine}"
        docker build -f /tmp/browser-context/browser-runtime.Dockerfile -t "${WORA_BROWSER_IMAGE:-wora-browser-runtime:1.0.0}" /tmp/browser-context

  # One-shot: generate a 0600 keyring only when the volume has no key yet.
  keyring-init:
    image: ${WORA_API_IMAGE:-wora-api:release}
    restart: "no"
    environment:
      WORA_SECRET_KEY_FILE: /app/data/.wora-secret-key
    volumes:
      - os-data:/app/data
    command: ["node", "dist/init-keyring.mjs"]

  # Durable mission worker. It shares the file-backed SQLite store and the
  # runtime-data volume, but not the API listener.
  os-worker:
    image: ${WORA_API_IMAGE:-wora-api:release}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORA_OS_DB: /app/data/wora-os.db
      WORA_WORKSPACE: /app/data/workspace
      WORA_RUNTIME_ROOT: /app/data/runtime
      WORA_OS_WORKSPACE_ID: ${WORA_OS_WORKSPACE_ID:?WORA_OS_WORKSPACE_ID must be set in .env}
      WORA_OS_WORKER_INTERVAL_MS: ${WORA_OS_WORKER_INTERVAL_MS:-15000}
      WORA_CLOUD_PROVIDER: docker
      WORA_BROWSER_PROVIDER: docker
      WORA_CLOUD_IMAGE: ${WORA_CLOUD_IMAGE:-node:22-alpine}
      WORA_BROWSER_IMAGE: ${WORA_BROWSER_IMAGE:-wora-browser-runtime:1.0.0}
      WORA_SECRET_KEY_FILE: /app/data/.wora-secret-key
      DOCKER_HOST: tcp://runtime-docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/api
    volumes:
      - os-data:/app/data
      - runtime-data:/app/data/runtime
      - runtime-certs:/certs:ro
    depends_on:
      keyring-init:
        condition: service_completed_successfully
      runtime-docker:
        condition: service_healthy
      runtime-certs-init:
        condition: service_completed_successfully
      runtime-bootstrap:
        condition: service_completed_successfully
    networks:
      - wora-net
      - wora-runtime-net

  # ── Frontend Static Bundle (React + Vite served by Nginx) ──
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_OS_API: ${VITE_OS_API:-}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
    restart: unless-stopped
    environment:
      PORT: "80"
    networks:
      - wora-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ── Nginx TLS Reverse Proxy & WebSocket Sticky Load Balancer ──
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
      client:
        condition: service_healthy
    networks:
      - wora-net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M

  # ── Redis Insight (opt-in local tunnel debugging only) ──
  redis-insight:
    image: redis/redisinsight:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:5540"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - wora-net
    profiles:
      - monitoring

volumes:
  redis-data:
  os-data:
  runtime-data:
  runtime-docker-data:
  runtime-certs:

networks:
  wora-net:
    driver: bridge
  wora-runtime-net:
    driver: bridge
    internal: true
