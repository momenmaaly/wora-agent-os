# ══════════════════════════════════════════════════════════════════
#  Wora Agent OS v4.1 — Production Docker Compose (2026)
#  Usage:
#    1. cp .env.example .env   (populate secrets & domain)
#    2. docker compose -f docker-compose.prod.yml up -d --build
#    3. docker compose -f docker-compose.prod.yml exec api node dist/seed.mjs
# ══════════════════════════════════════════════════════════════════

services:
  # ── Redis (BullMQ + Socket.IO Adapter + Presence + Workspaces) ──
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      - --maxmemory
      - 768mb
      - --maxmemory-policy
      - noeviction
      - --save
      - "60"
      - "1000"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-data:/data
    networks:
      - wora-net
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 896M

  # ── API Server + Socket.IO + BullMQ Worker (horizontally scalable) ──
  api:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONGO_URI: ${MONGO_URI:?MONGO_URI must be set in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set in .env}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      STUDIO_PROVIDER: ${STUDIO_PROVIDER:-}
      STUDIO_MODEL: ${STUDIO_MODEL:-}
      GITHUB_SKILLS_TOKEN: ${GITHUB_SKILLS_TOKEN:-}
      MAX_SOCKETS: ${MAX_SOCKETS:-6000}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-30}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-90000}
      WORA_OS_DB: /app/data/wora-os.db
      WORA_WORKSPACE: /app/data/workspace
    volumes:
      - os-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - wora-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  # ── Frontend Static Bundle (React + Vite served by Nginx) ──
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
    restart: unless-stopped
    environment:
      PORT: "80"
    networks:
      - wora-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ── Nginx TLS Reverse Proxy & WebSocket Sticky Load Balancer ──
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
      client:
        condition: service_healthy
    networks:
      - wora-net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M

  # ── Redis Insight (opt-in local tunnel debugging only) ──
  redis-insight:
    image: redis/redisinsight:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:5540"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - wora-net
    profiles:
      - monitoring

volumes:
  redis-data:
  os-data:

networks:
  wora-net:
    driver: bridge
